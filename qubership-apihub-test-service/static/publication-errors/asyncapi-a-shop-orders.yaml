asyncapi: 3.0.0
info:
  title: Shop Events A
  version: 1.0.0
  description: Order and user events for package A (shop domain).
channels:
  orderPlaced:
    address: shop/orders/placed
    messages:
      OrderPlaced:
        $ref: '#/components/messages/OrderPlaced'
  userRegistered:
    address: shop/users/registered
    messages:
      UserRegistered:
        $ref: '#/components/messages/UserRegistered'
operations:
  publishOrderPlaced:
    action: send
    channel:
      $ref: '#/channels/orderPlaced'
    messages:
      - $ref: '#/channels/orderPlaced/messages/OrderPlaced'
  publishUserRegistered:
    action: send
    channel:
      $ref: '#/channels/userRegistered'
    messages:
      - $ref: '#/channels/userRegistered/messages/UserRegistered'
components:
  messages:
    OrderPlaced:
      title: Order Placed
      description: Order placed event payload
      payload:
        type: object
        required:
          - orderId
          - userId
        properties:
          orderId:
            type: string
          userId:
            type: string
          total:
            type: number
          meta01:
            type: string
          meta02:
            type: string
          meta03:
            type: string
          meta04:
            type: string
