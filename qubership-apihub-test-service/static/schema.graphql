directive @limit(offset: Int = 0, limit: Int = 20) on FIELD | FIELD_DEFINITION

type Todo {
  id: ID!
  name: String!
  color: Color

  "A field that requires an argument"
  colors(filter: [Color!]!): [Color!]!
}

enum Color {
  "Red color"
  RED
}

input TodoInputType {
  name: String!
  completed: Boolean @deprecated(reason: "not used")
  color: Color = RED
}

type Query {
  "A Query with 1 required argument and 1 optional argument"
  todo(
    id: ID!
  ): Todo

  """
    Returns a list (or null) that can contain null values
  """
  todos(
    "Required argument that is a list that cannot contain null values"
    ids: [String!]! 
  ): [Todo] @limit
}

type Mutation {
  "A Mutation with 1 required argument"
  create_todo(
    todo: TodoInputType!
  ): Todo!
}